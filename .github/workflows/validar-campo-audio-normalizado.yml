# Workflow temporário exclusivo da branch dev.
# Descrição: aplica e valida a correção que cria um campo de áudio normalizado
# separado e insere esse campo na mesma face do card onde o áudio original é usado.
name: Validar campo e HTML do áudio normalizado
run-name: Validar criação do campo e inserção no HTML

on:
  push:
    branches:
      - dev
    paths:
      - .github/workflows/validar-campo-audio-normalizado.yml

permissions:
  contents: write

jobs:
  corrigir-validar:
    name: Corrigir, testar e auditar
    runs-on: ubuntu-24.04
    steps:
      - name: Obter código da branch dev
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: dev
          fetch-depth: 0

      - name: Aplicar correção do campo e HTML
        shell: bash
        run: |
          set -euo pipefail
          python3 .devtools/corrigir_campo_audio_html.py

      - name: Preparar Playwright
        shell: bash
        run: |
          set -euo pipefail
          python3 -m venv .venv
          .venv/bin/python -m pip install --disable-pip-version-check --no-cache-dir 'playwright==1.63.0'
          .venv/bin/python -m playwright install --with-deps chromium

      - name: Executar testes automatizados
        shell: bash
        run: |
          set -euo pipefail
          .venv/bin/python -m compileall -q __init__.py analysis_engine.py normalized_audio.py i18n.py v010.py tests
          .venv/bin/python -m unittest discover -s tests -p 'test_*.py' -v
          .venv/bin/python build.py
          test -f dist/Balanced_Audio_Controller-v0.10.0.ankiaddon

      - name: Validar segurança e comportamento
        shell: bash
        run: |
          set -euo pipefail
          .venv/bin/python - <<'PY'
          import ast
          from pathlib import Path

          problemas = []
          for arquivo in [Path('__init__.py'), Path('analysis_engine.py'), Path('normalized_audio.py'), Path('v010.py')]:
              arvore = ast.parse(arquivo.read_text(encoding='utf-8'), filename=str(arquivo))
              for no in ast.walk(arvore):
                  if isinstance(no, ast.Call):
                      for kw in no.keywords:
                          if kw.arg == 'shell' and isinstance(kw.value, ast.Constant) and kw.value.value is True:
                              problemas.append(f'{arquivo}:{getattr(no, "lineno", "?")}: shell=True')

          core = Path('v010.py').read_text(encoding='utf-8')
          js = Path('web/audio_controller_v010.js').read_text(encoding='utf-8')
          helper = Path('normalized_audio.py').read_text(encoding='utf-8')
          if 'ferreis_audio:v010:prepare-field' not in core or 'ferreis_audio:v010:prepare-field' not in js:
              problemas.append('ação explícita de preparação de campo não está ligada entre UI e backend')
          if 'template_sides_for_fields' not in core or 'template_sides_for_fields' not in helper:
              problemas.append('detecção de frente/verso do template ausente')
          if 'for side in ("qfmt", "afmt")' not in core:
              problemas.append('backend não atualiza frente e verso de forma controlada')
          if 'source_fields' not in core:
              problemas.append('mapeamento do campo de áudio original ausente')
          if problemas:
              raise SystemExit('\n'.join(problemas))
          print('Validação de segurança e comportamento concluída sem violações detectadas.')
          PY

      - name: Registrar correção na branch dev
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Rafael Fernando dos reis Mecabô"
          git config user.email "rafa_ferreis@hotmail.com"
          git add normalized_audio.py v010.py web/audio_controller_v010.js i18n.py config.schema.json README.md tests/test_normalized_audio.py tests/test_audio_controller_playwright.py
          git diff --cached --check
          git commit -m "fix: criar campo de áudio normalizado e inserir no HTML"
          git push origin HEAD:dev
