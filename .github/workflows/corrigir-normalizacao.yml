# Workflow temporário da branch dev.
# Descrição: aplica a correção de estabilidade da normalização, executa testes Playwright e valida regras de segurança antes do commit.
name: Corrigir e validar normalização
run-name: Corrigir e validar normalização do áudio

on:
  push:
    branches:
      - dev
    paths:
      - .github/workflows/corrigir-normalizacao.yml

permissions:
  contents: write

jobs:
  corrigir-validar:
    name: Corrigir, testar e auditar
    runs-on: ubuntu-24.04
    steps:
      - name: Obter código da branch dev
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: dev
          fetch-depth: 0

      - name: Aplicar correção da normalização
        shell: bash
        run: |
          set -euo pipefail
          python3 .devtools/corrigir_normalizacao.py

      - name: Preparar Playwright
        shell: bash
        run: |
          set -euo pipefail
          python3 -m venv .venv
          .venv/bin/python -m pip install --disable-pip-version-check --no-cache-dir playwright
          .venv/bin/python -m playwright install --with-deps chromium

      - name: Executar testes automatizados
        shell: bash
        run: |
          set -euo pipefail
          .venv/bin/python -m compileall -q __init__.py analysis_engine.py i18n.py v010.py tests
          .venv/bin/python -m unittest discover -s tests -p 'test_*.py' -v

      - name: Validar segurança da alteração
        shell: bash
        run: |
          set -euo pipefail
          .venv/bin/python - <<'PY'
          import ast
          from pathlib import Path

          problemas = []
          for arquivo in [Path('__init__.py'), Path('analysis_engine.py'), Path('v010.py')]:
              arvore = ast.parse(arquivo.read_text(encoding='utf-8'), filename=str(arquivo))
              for no in ast.walk(arvore):
                  if isinstance(no, ast.Call):
                      for kw in no.keywords:
                          if kw.arg == 'shell' and isinstance(kw.value, ast.Constant) and kw.value.value is True:
                              problemas.append(f'{arquivo}:{getattr(no, "lineno", "?")}: shell=True')

          source = Path('__init__.py').read_text(encoding='utf-8')
          if 'av_player_will_play.append(_on_av_player_will_play)' not in source:
              problemas.append('normalização não está configurada no hook pré-playback')
          if 'update_filters=update_filters' not in source:
              problemas.append('settings não separam propriedades e filtros')
          if problemas:
              raise SystemExit('\n'.join(problemas))
          print('Validação de segurança concluída sem violações detectadas.')
          PY

      - name: Registrar correção na branch dev
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Rafael Fernando dos reis Mecabô"
          git config user.email "rafa_ferreis@hotmail.com"
          git add __init__.py web/audio_controller.js tests/test_playback_regression.py tests/test_audio_controller_playwright.py
          git diff --cached --check
          git commit -m "fix: estabilizar normalização durante reprodução"
          git push origin HEAD:dev
