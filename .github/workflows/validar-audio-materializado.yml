# Workflow temporário exclusivo da branch dev.
# Descrição: aplica a melhoria de áudio normalizado materializado, executa testes Playwright,
# valida segurança e empacotamento, e registra somente as alterações aprovadas na branch dev.
name: Validar áudio normalizado materializado
run-name: Validar criação e vínculo de áudio normalizado

on:
  push:
    branches:
      - dev
    paths:
      - .github/workflows/validar-audio-materializado.yml

permissions:
  contents: write

jobs:
  validar-audio-materializado:
    name: Implementar, testar e auditar
    runs-on: ubuntu-24.04
    steps:
      - name: Obter código da branch dev
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: dev
          fetch-depth: 0

      - name: Aplicar melhoria de áudio normalizado
        shell: bash
        run: |
          set -euo pipefail
          python3 .devtools/implementar_audio_materializado.py

      - name: Preparar Playwright
        shell: bash
        run: |
          set -euo pipefail
          python3 -m venv .venv
          .venv/bin/python -m pip install --disable-pip-version-check --no-cache-dir playwright
          .venv/bin/python -m playwright install --with-deps chromium

      - name: Executar testes automatizados
        shell: bash
        run: |
          set -euo pipefail
          .venv/bin/python -m compileall -q __init__.py analysis_engine.py normalized_audio.py i18n.py v010.py tests
          .venv/bin/python -m unittest discover -s tests -p 'test_*.py' -v
          .venv/bin/python build.py
          test -f dist/Balanced_Audio_Controller-v0.10.0.ankiaddon

      - name: Validar segurança da alteração
        shell: bash
        run: |
          set -euo pipefail
          .venv/bin/python - <<'PY'
          import ast
          import zipfile
          from pathlib import Path

          problemas = []
          for arquivo in [Path('__init__.py'), Path('analysis_engine.py'), Path('normalized_audio.py'), Path('v010.py')]:
              arvore = ast.parse(arquivo.read_text(encoding='utf-8'), filename=str(arquivo))
              for no in ast.walk(arvore):
                  if isinstance(no, ast.Call):
                      for kw in no.keywords:
                          if kw.arg == 'shell' and isinstance(kw.value, ast.Constant) and kw.value.value is True:
                              problemas.append(f'{arquivo}:{getattr(no, "lineno", "?")}: shell=True')

          normalized = Path('normalized_audio.py').read_text(encoding='utf-8')
          v010 = Path('v010.py').read_text(encoding='utf-8')
          if 'subprocess.run(' not in normalized or 'shell=False' not in normalized:
              problemas.append('renderização não explicita shell=False')
          if '_safe_media_path(media_dir, filename)' not in v010:
              problemas.append('materialização não valida caminho da mídia de origem')
          if 'mw.col.media.add_file(str(path))' not in v010:
              problemas.append('arquivo gerado não passa pelo gerenciador de mídia do Anki')
          if 'is_managed_field_value(current)' not in v010:
              problemas.append('campo existente não é protegido contra sobrescrita de conteúdo do usuário')
          if 'mw.col.models.update_dict(model)' not in v010:
              problemas.append('template/campo não é persistido pelo gerenciador de modelos do Anki')

          pacote = Path('dist/Balanced_Audio_Controller-v0.10.0.ankiaddon')
          with zipfile.ZipFile(pacote, 'r') as archive:
              ruim = archive.testzip()
              if ruim:
                  problemas.append(f'pacote corrompido: {ruim}')
              if 'normalized_audio.py' not in archive.namelist():
                  problemas.append('normalized_audio.py ausente do pacote')

          if problemas:
              raise SystemExit('\n'.join(problemas))
          print('Validação de segurança e pacote concluída sem violações detectadas.')
          PY

      - name: Registrar melhoria na branch dev
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Rafael Fernando dos reis Mecabô"
          git config user.email "rafa_ferreis@hotmail.com"
          git add analysis_engine.py normalized_audio.py v010.py i18n.py config.json config.schema.json build.py README.md web/audio_controller_v010.js tests/test_analysis_engine.py tests/test_normalized_audio.py tests/test_audio_controller_playwright.py
          git diff --cached --check
          git commit -m "feat: materializar cópias de áudio normalizadas"
          git push origin HEAD:dev
