# Workflow temporário exclusivo da branch dev.
# Descrição: valida que cópias bac_norm_* não recebem normalização novamente
# e não entram recursivamente em novas análises/materializações.
name: Validar proteção do áudio materializado
run-name: Validar proteção contra dupla normalização

on:
  push:
    branches:
      - dev
    paths:
      - .github/workflows/validar-protecao-audio-materializado.yml

permissions:
  contents: write

jobs:
  validar-protecao:
    name: Corrigir, testar e auditar
    runs-on: ubuntu-24.04
    steps:
      - name: Obter código da branch dev
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: dev
          fetch-depth: 0

      - name: Aplicar proteção contra dupla normalização
        shell: bash
        run: |
          set -euo pipefail
          python3 .devtools/corrigir_audio_materializado.py
          python3 - <<'PY'
          from pathlib import Path
          path = Path('tests/test_playback_regression.py')
          source = path.read_text(encoding='utf-8')
          anchor = '            "_is_mpv_player": lambda value: value is player,\n'
          addition = anchor + '            "_is_materialized_audio": lambda filename: False,\n'
          if anchor not in source:
              raise SystemExit('fixture base não encontrado')
          path.write_text(source.replace(anchor, addition, 1), encoding='utf-8')
          PY

      - name: Preparar Playwright
        shell: bash
        run: |
          set -euo pipefail
          python3 -m venv .venv
          .venv/bin/python -m pip install --disable-pip-version-check --no-cache-dir playwright
          .venv/bin/python -m playwright install --with-deps chromium

      - name: Executar testes automatizados
        shell: bash
        run: |
          set -euo pipefail
          .venv/bin/python -m compileall -q __init__.py analysis_engine.py normalized_audio.py i18n.py v010.py tests
          .venv/bin/python -m unittest discover -s tests -p 'test_*.py' -v
          .venv/bin/python build.py
          test -f dist/Balanced_Audio_Controller-v0.10.0.ankiaddon

      - name: Validar segurança e recursão
        shell: bash
        run: |
          set -euo pipefail
          .venv/bin/python - <<'PY'
          import ast
          from pathlib import Path

          problemas = []
          for arquivo in [Path('__init__.py'), Path('analysis_engine.py'), Path('normalized_audio.py'), Path('v010.py')]:
              arvore = ast.parse(arquivo.read_text(encoding='utf-8'), filename=str(arquivo))
              for no in ast.walk(arvore):
                  if isinstance(no, ast.Call):
                      for kw in no.keywords:
                          if kw.arg == 'shell' and isinstance(kw.value, ast.Constant) and kw.value.value is True:
                              problemas.append(f'{arquivo}:{getattr(no, "lineno", "?")}: shell=True')

          core = Path('__init__.py').read_text(encoding='utf-8')
          v010 = Path('v010.py').read_text(encoding='utf-8')
          if 'MATERIALIZED_AUDIO_PREFIX = "bac_norm_"' not in core:
              problemas.append('prefixo de áudio materializado não definido no core')
          if 'if _is_materialized_audio(filename):' not in core:
              problemas.append('reprodução não ignora filtros para áudio materializado')
          if 'files = {filename for filename in files if not _is_materialized_audio(filename)}' not in core:
              problemas.append('análise não exclui áudio materializado')
          if 'GENERATED_PREFIX.casefold()' not in v010:
              problemas.append('materialização não filtra perfis antigos com bac_norm_*')

          if problemas:
              raise SystemExit('\n'.join(problemas))
          print('Validação de segurança e dupla normalização concluída sem violações detectadas.')
          PY

      - name: Registrar proteção na branch dev
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Rafael Fernando dos reis Mecabô"
          git config user.email "rafa_ferreis@hotmail.com"
          git add __init__.py v010.py i18n.py tests/test_playback_regression.py
          git diff --cached --check
          git commit -m "fix: evitar dupla normalização de cópias materializadas"
          git push origin HEAD:dev
