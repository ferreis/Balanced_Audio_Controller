# Workflow temporário exclusivo da branch dev.
# Descrição: aplica e valida a reorganização que mantém o painel do revisor
# compacto e move configurações/ações avançadas para o menu Ferramentas.
name: Validar painel compacto e configurações
run-name: Validar configurações em Ferramentas

on:
  push:
    branches:
      - dev

permissions:
  contents: write

jobs:
  validar:
    name: Aplicar, testar e auditar
    runs-on: ubuntu-24.04
    steps:
      - name: Obter código da branch dev
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: dev
          fetch-depth: 0

      - name: Aplicar reorganização da interface
        shell: bash
        run: |
          set -euo pipefail
          python3 .devtools/enxugar_painel_config.py

      - name: Preparar Playwright
        shell: bash
        run: |
          set -euo pipefail
          python3 -m venv .venv
          .venv/bin/python -m pip install --disable-pip-version-check --no-cache-dir 'playwright==1.63.0'
          .venv/bin/python -m playwright install --with-deps chromium

      - name: Executar testes automatizados
        shell: bash
        run: |
          set -euo pipefail
          .venv/bin/python -m compileall -q __init__.py analysis_engine.py normalized_audio.py i18n.py v010.py tests
          .venv/bin/python -m unittest discover -s tests -p 'test_*.py' -v
          .venv/bin/python build.py
          test -f dist/Balanced_Audio_Controller-v0.10.0.ankiaddon

      - name: Validar segurança e organização da interface
        shell: bash
        run: |
          set -euo pipefail
          .venv/bin/python - <<'PY'
          import ast
          from pathlib import Path

          problemas = []
          for arquivo in [Path('__init__.py'), Path('analysis_engine.py'), Path('normalized_audio.py'), Path('v010.py')]:
              arvore = ast.parse(arquivo.read_text(encoding='utf-8'), filename=str(arquivo))
              for no in ast.walk(arvore):
                  if isinstance(no, ast.Call):
                      for kw in no.keywords:
                          if kw.arg == 'shell' and isinstance(kw.value, ast.Constant) and kw.value.value is True:
                              problemas.append(f'{arquivo}:{getattr(no, "lineno", "?")}: shell=True')

          painel = Path('web/audio_controller.js').read_text(encoding='utf-8')
          extensao = Path('web/audio_controller_v010.js').read_text(encoding='utf-8')
          backend = Path('v010.py').read_text(encoding='utf-8')

          proibidos = [
              '.fac-loudness', '.fac-dual-mono', '.fac-deck-enable', '.fac-clear-deck',
              '.fac-analysis-backend', '.fac-install-ffmpeg', '.fac-prepare-normalized-field',
              '.fac-materialize-normalized', '.fac-materialize-template',
          ]
          for seletor in proibidos:
              if seletor in painel or seletor in extensao:
                  problemas.append(f'controle avançado permaneceu no painel: {seletor}')

          for esperado in (
              'def _open_settings_dialog()',
              'mw.form.menuTools.addMenu(menu)',
              'settings_menu_action',
              '_prepare_normalized_field_setup',
              '_start_materialization',
              '_install_ffmpeg',
          ):
              if esperado not in backend:
                  problemas.append(f'configuração em Ferramentas incompleta: {esperado}')

          if problemas:
              raise SystemExit('\n'.join(problemas))
          print('Validação de segurança e organização concluída sem violações detectadas.')
          PY

      - name: Registrar alterações na branch dev
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Rafael Fernando dos reis Mecabô"
          git config user.email "rafa_ferreis@hotmail.com"
          git add README.md i18n.py v010.py web/audio_controller.js web/audio_controller_v010.js tests/test_audio_controller_playwright.py
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "Nenhuma alteração de produto pendente."
            exit 0
          fi
          git commit -m "feat: mover configurações avançadas para Ferramentas"
          git push origin HEAD:dev
