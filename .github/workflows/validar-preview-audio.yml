# Workflow temporário exclusivo da branch dev.
# Descrição: integra o mesmo painel de áudio ao Previewer/CardLayout, valida a
# troca Frente/Verso e garante que o contexto correto do deck acompanha o áudio.
name: Validar painel de áudio na pré-visualização
run-name: Validar painel no Previewer e CardLayout

on:
  push:
    branches:
      - dev

permissions:
  contents: write

jobs:
  validar:
    name: Aplicar, testar e auditar pré-visualização
    runs-on: ubuntu-24.04
    steps:
      - name: Obter código da branch dev
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: dev
          fetch-depth: 0

      - name: Confirmar regras do agente
        shell: bash
        run: cat AGENTS.md

      - name: Aplicar integração do painel no preview
        shell: bash
        run: |
          set -euo pipefail
          python3 .devtools/preparar_preview_audio.py
          python3 .devtools/adicionar_preview_audio.py
          python3 .devtools/complementar_preview_audio.py

      - name: Preparar Playwright
        shell: bash
        run: |
          set -euo pipefail
          python3 -m venv .venv
          .venv/bin/python -m pip install --disable-pip-version-check --no-cache-dir 'playwright==1.63.0'
          .venv/bin/python -m playwright install --with-deps chromium

      - name: Executar testes automatizados e gerar pacote
        shell: bash
        run: |
          set -euo pipefail
          .venv/bin/python -m compileall -q __init__.py analysis_engine.py normalized_audio.py i18n.py v010.py tests
          .venv/bin/python -m unittest discover -s tests -p 'test_*.py' -v
          .venv/bin/python build.py
          test -f dist/Balanced_Audio_Controller-v0.10.0.ankiaddon

      - name: Validar segurança e integração do preview
        shell: bash
        run: |
          set -euo pipefail
          .venv/bin/python - <<'PY'
          import ast
          from pathlib import Path

          problemas = []
          for arquivo in [Path('__init__.py'), Path('analysis_engine.py'), Path('normalized_audio.py'), Path('v010.py')]:
              arvore = ast.parse(arquivo.read_text(encoding='utf-8'), filename=str(arquivo))
              for no in ast.walk(arvore):
                  if isinstance(no, ast.Call):
                      for kw in no.keywords:
                          if kw.arg == 'shell' and isinstance(kw.value, ast.Constant) and kw.value.value is True:
                              problemas.append(f'{arquivo}:{getattr(no, "lineno", "?")}: shell=True')

          core = Path('__init__.py').read_text(encoding='utf-8')
          extensao = Path('v010.py').read_text(encoding='utf-8')
          normalizado = Path('normalized_audio.py').read_text(encoding='utf-8')
          painel = Path('web/audio_controller.js').read_text(encoding='utf-8')
          painel_v010 = Path('web/audio_controller_v010.js').read_text(encoding='utf-8')

          obrigatorios = [
              '"previewQuestion": ("previewer", "question")',
              '"previewAnswer": ("previewer", "answer")',
              '"clayoutQuestion": ("card_layout", "question")',
              '"clayoutAnswer": ("card_layout", "answer")',
              'gui_hooks.av_player_will_play_tags.append(_on_av_player_will_play_tags)',
          ]
          for esperado in obrigatorios:
              if esperado not in core:
                  problemas.append(f'integração ausente: {esperado}')

          if 'ferreis_audio:v010:settings' not in extensao:
              problemas.append('atalho de configurações do preview ausente')
          if 'context.web.eval(' in extensao:
              problemas.append('v010 ainda depende diretamente de context.web')
          if 'mountedRoot' not in painel_v010 or 'attach(root)' not in painel_v010:
              problemas.append('ciclo de vida Frente/Verso não foi corrigido')
          if 'fac-preview-side-badge' not in painel:
              problemas.append('indicador Frente/Verso ausente')
          if '_safe_media_path' not in extensao or 'relative_to(root)' not in extensao:
              problemas.append('validação de path traversal da mídia ausente')
          if 'shell=False' not in normalizado:
              problemas.append('renderização normalizada deve manter shell=False explícito')

          if problemas:
              raise SystemExit('\n'.join(problemas))
          print('Validação de segurança e preview concluída sem violações detectadas.')
          PY

      - name: Registrar alterações na branch dev
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Rafael Fernando dos reis Mecabô"
          git config user.email "rafa_ferreis@hotmail.com"
          git add __init__.py i18n.py v010.py web/audio_controller.js web/audio_controller_v010.js web/audio_controller.css tests/test_audio_controller_playwright.py tests/test_preview_context.py
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "Nenhuma alteração de produto pendente."
            exit 0
          fi
          git commit -m "feat: integrar painel de áudio à pré-visualização"
          git push origin HEAD:dev
